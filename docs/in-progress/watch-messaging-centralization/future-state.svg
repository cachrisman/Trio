<svg width="100%" viewBox="0 0 680 610" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Future state: watch messaging architecture</title>
<desc>Shared contracts at top; symmetric outbound and inbound stacks on iPhone and Apple Watch; watch-only downstream domain concerns below handlers.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: system-ui, sans-serif; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; font-weight: 400; }
    .label { font-size: 12px; font-weight: 500; fill: #5F5E5A; }
    .group { font-size: 11px; font-weight: 600; fill: #7A7872; letter-spacing: 0.04em; }
    .teal-box { fill: #E1F5EE; stroke: #0F6E56; }
    .teal-th { fill: #085041; }
    .teal-ts { fill: #0F6E56; }
    .blue-box { fill: #E6F1FB; stroke: #185FA5; }
    .blue-th { fill: #0C447C; }
    .purple-box { fill: #EEEDFE; stroke: #534AB7; }
    .purple-th { fill: #3C3489; }
    .subtle { stroke: #C8C6BE; stroke-width: 0.5; stroke-dasharray: 3 2; }
    .owner-sub { font-size: 11px; font-weight: 500; opacity: 0.92; }
  </style>
</defs>

<!-- Shared contracts -->
<rect x="15" y="15" width="650" height="46" rx="8" class="teal-box" stroke-width="0.5"/>
<text class="th teal-th" x="340" y="33" text-anchor="middle" dominant-baseline="central">Shared contracts</text>
<text class="ts teal-ts" x="340" y="50" text-anchor="middle" dominant-baseline="central">typed envelopes · shared keys · payload families</text>

<!-- Leader lines -->
<line x1="144" y1="62" x2="144" y2="72" class="subtle"/>
<line x1="536" y1="62" x2="536" y2="72" class="subtle"/>

<!-- iPhone container -->
<rect x="15" y="72" width="258" height="368" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 3"/>
<text class="label" x="144" y="90" text-anchor="middle">iPhone</text>

<!-- iPhone group labels -->
<text class="group" x="28" y="108">OUTBOUND</text>
<text class="group" x="28" y="206">INBOUND</text>

<!-- Phone boxes -->
<rect x="28" y="116" width="232" height="32" rx="5" class="blue-box" stroke-width="0.5"/>
<text class="th blue-th" x="144" y="132" text-anchor="middle" dominant-baseline="central">Typed sender APIs</text>

<rect x="28" y="156" width="232" height="32" rx="5" class="blue-box" stroke-width="0.5"/>
<text class="th blue-th" x="144" y="172" text-anchor="middle" dominant-baseline="central">Transport policy</text>

<!-- iPhone owner box -->
<rect x="28" y="218" width="232" height="40" rx="5" class="blue-box" stroke-width="0.5"/>
<text class="th blue-th" x="144" y="230" text-anchor="middle" dominant-baseline="central">Thin WCSession owner</text>
<text class="ts owner-sub blue-th" x="144" y="244" text-anchor="middle" dominant-baseline="central">(BaseWatchManager)</text>

<rect x="28" y="266" width="232" height="32" rx="5" class="blue-box" stroke-width="0.5"/>
<text class="th blue-th" x="144" y="282" text-anchor="middle" dominant-baseline="central">Decode / validate</text>

<rect x="28" y="306" width="232" height="32" rx="5" class="blue-box" stroke-width="0.5"/>
<text class="th blue-th" x="144" y="322" text-anchor="middle" dominant-baseline="central">Dedup / idempotency gate</text>

<rect x="28" y="346" width="232" height="32" rx="5" class="blue-box" stroke-width="0.5"/>
<text class="th blue-th" x="144" y="362" text-anchor="middle" dominant-baseline="central">Inbound dispatcher</text>

<rect x="28" y="386" width="232" height="32" rx="5" class="blue-box" stroke-width="0.5"/>
<text class="th blue-th" x="144" y="402" text-anchor="middle" dominant-baseline="central">Typed handlers</text>

<!-- Watch container -->
<rect x="407" y="72" width="258" height="462" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 3"/>
<text class="label" x="536" y="90" text-anchor="middle">Apple Watch</text>

<!-- Watch group labels -->
<text class="group" x="420" y="108">OUTBOUND</text>
<text class="group" x="420" y="206">INBOUND</text>
<text class="group" x="420" y="440">WATCH-ONLY DOWNSTREAM</text>

<!-- Watch boxes -->
<rect x="420" y="116" width="232" height="32" rx="5" class="purple-box" stroke-width="0.5"/>
<text class="th purple-th" x="536" y="132" text-anchor="middle" dominant-baseline="central">Typed sender APIs</text>

<rect x="420" y="156" width="232" height="32" rx="5" class="purple-box" stroke-width="0.5"/>
<text class="th purple-th" x="536" y="172" text-anchor="middle" dominant-baseline="central">Transport policy</text>

<!-- Watch owner box -->
<rect x="420" y="218" width="232" height="40" rx="5" class="purple-box" stroke-width="0.5"/>
<text class="th purple-th" x="536" y="230" text-anchor="middle" dominant-baseline="central">Thin WCSession owner</text>
<text class="ts owner-sub purple-th" x="536" y="244" text-anchor="middle" dominant-baseline="central">(WatchState)</text>

<rect x="420" y="266" width="232" height="32" rx="5" class="purple-box" stroke-width="0.5"/>
<text class="th purple-th" x="536" y="282" text-anchor="middle" dominant-baseline="central">Decode / validate</text>

<rect x="420" y="306" width="232" height="32" rx="5" class="purple-box" stroke-width="0.5"/>
<text class="th purple-th" x="536" y="322" text-anchor="middle" dominant-baseline="central">Dedup / idempotency gate</text>

<rect x="420" y="346" width="232" height="32" rx="5" class="purple-box" stroke-width="0.5"/>
<text class="th purple-th" x="536" y="362" text-anchor="middle" dominant-baseline="central">Inbound dispatcher</text>

<rect x="420" y="386" width="232" height="32" rx="5" class="purple-box" stroke-width="0.5"/>
<text class="th purple-th" x="536" y="402" text-anchor="middle" dominant-baseline="central">Typed handlers</text>

<!-- Watch-only downstream -->
<rect x="444" y="452" width="184" height="30" rx="5" class="purple-box" stroke-width="0.5"/>
<text class="th purple-th" x="536" y="467" text-anchor="middle" dominant-baseline="central">Completion coordinator</text>

<rect x="444" y="492" width="184" height="30" rx="5" class="purple-box" stroke-width="0.5"/>
<text class="th purple-th" x="536" y="507" text-anchor="middle" dominant-baseline="central">Complication store</text>

<!-- WC connector -->
<text class="label" x="340" y="196" text-anchor="middle">WatchConnectivity</text>
<line x1="275" y1="238" x2="405" y2="238" stroke="#888780" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>